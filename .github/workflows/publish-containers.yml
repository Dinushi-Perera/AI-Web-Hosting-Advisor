name: Publish GHCR Containers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            image: ai-web-hosting-advisor-backend
            build_args: ""
          - component: frontend
            context: ./frontend
            image: ai-web-hosting-advisor-frontend
            build_args: |
              NEXT_PUBLIC_API_BASE_URL=${{ vars.DOCKER_PUBLIC_API_BASE_URL || 'http://localhost:8001/api/v1' }}
              NEXT_PUBLIC_DEMO_MODE=false
              NEXT_PUBLIC_AUTH_REQUIRED=true

    steps:
      - uses: actions/checkout@v6

      - name: Resolve lowercase container owner
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=AI Web Hosting Advisor ${{ matrix.component }}
            org.opencontainers.image.description=${{ matrix.component }} container for AI Web Hosting Advisor

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: mode=max
          sbom: true

      - name: Write publication summary
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## ${{ matrix.component }} image published"
            echo
            while IFS= read -r image_tag; do
              [[ -n "$image_tag" ]] && echo "- \`$image_tag\`"
            done <<< "$IMAGE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
