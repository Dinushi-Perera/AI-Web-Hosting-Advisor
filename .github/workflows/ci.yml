name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DATABASE_URL: sqlite:///./ci-test.db
      JWT_SECRET: ci-only-secret-that-is-longer-than-32-characters
      LLM_ENABLED: "false"
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run backend tests
        run: mkdir -p test-results && python -m pytest --junitxml=test-results/junit.xml
      - name: Upload backend test results
        # A superseding CI run can cancel this job before pytest creates the
        # report. Upload only when a report exists, while still preserving it
        # when pytest itself fails.
        if: ${{ !cancelled() && hashFiles('backend/test-results/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Run frontend tests
        run: mkdir -p test-results && npm run test:ci
      - name: Build frontend
        run: npm run build
      - name: Upload frontend test results
        # Do not turn an expected concurrency cancellation into a misleading
        # "No files were found" artifact error. Failed test reports still upload.
        if: ${{ !cancelled() && hashFiles('frontend/test-results/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results/
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker build and Compose integration
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    env:
      MYSQL_DATABASE: ai_web_hosting_advisor
      MYSQL_APP_USER: hosting_app
      MYSQL_APP_PASSWORD: ci-hosting-app-password
      MYSQL_ROOT_PASSWORD: ci-mysql-root-password
      JWT_SECRET: ci-only-secret-that-is-longer-than-32-characters
      SEED_ADMIN_EMAIL: admin@hostingadvisor.local
      SEED_ADMIN_PASSWORD: CiAdmin123!ChangeMe
      FRONTEND_HOST_PORT: "3001"
      BACKEND_HOST_PORT: "8001"
      MYSQL_HOST_PORT: "3307"
      REDIS_HOST_PORT: "6379"
      DOCKER_PUBLIC_API_BASE_URL: http://localhost:8001/api/v1
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build --pull
      - name: Start and wait for the full stack
        run: docker compose up --detach --wait --wait-timeout 240
      - name: Verify backend readiness
        run: curl --fail --show-error --silent http://localhost:8001/health/ready
      - name: Verify Celery worker response
        run: docker compose exec --no-TTY worker celery -A app.workers.celery_app.celery_app inspect ping --timeout 10
      - name: Verify frontend response
        run: curl --fail --show-error --silent --output /dev/null http://localhost:3001/
      - name: Record container state and logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/docker-compose-ps.txt
          docker compose images > artifacts/docker-compose-images.txt
          docker compose logs --no-color > artifacts/docker-compose.log
      - name: Upload Docker verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-verification
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
